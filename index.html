<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: Arial, "Noto Sans KR", sans-serif;
      text-align: center;
    }

    .wrap {
      padding: 40px 24px;
    }

    .eng {
      margin-bottom: 30px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 19px;
      font-weight: 400;
      line-height: 1.6;
    }

    p {
      margin: 0;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="eng">WEDDING INVITATION</div>

    <h1>모바일 청첩장을 준비하고 있습니다.</h1>

    <p>
      소중한 날의 이야기를 담아<br>
      곧 찾아뵙겠습니다.
    </p>
  </div>
</body>
</html>
